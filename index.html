<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Liz Fashion Industry 3D Map</title>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.118/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<style>

html,body,#cesiumContainer{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

#infoPanel{
    position:absolute;
    top:15px;
    left:15px;
    width:320px;
    z-index:9999;
    background:rgba(20,20,20,.90);
    color:white;
    border-radius:12px;
    padding:15px;
    font-family:Arial,sans-serif;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

#infoPanel h2{
    margin:0 0 10px;
}

#viewFactory{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    margin-top:10px;
}

@media(max-width:768px){

#infoPanel{
    width:90%;
    left:5%;
    top:10px;
}

}

</style>
</head>

<body>

<div id="infoPanel">

    <h2>🏭 Liz Fashion Industry</h2>

    <p>
    <strong>Location:</strong><br>
    Shafipur, Kaliakoir, Gazipur, Bangladesh
    </p>

    <p><strong>Latitude:</strong> 24.0320434</p>
    <p><strong>Longitude:</strong> 90.2701416</p>

    <button id="viewFactory">
        View Factory
    </button>

</div>

<div id="cesiumContainer"></div>

<script>

Cesium.Ion.defaultAccessToken =
"PASTE_YOUR_CESIUM_ION_TOKEN_HERE";

const factoryLat = 24.0320434;
const factoryLon = 90.2701416;

const viewer = new Cesium.Viewer("cesiumContainer",{

    terrain: Cesium.Terrain.fromWorldTerrain(),

    animation:false,
    timeline:false,
    geocoder:true,
    homeButton:true,
    sceneModePicker:true,
    navigationHelpButton:true,
    fullscreenButton:true,
    baseLayerPicker:true

});

viewer.scene.globe.depthTestAgainstTerrain = true;

viewer.camera.flyTo({

    destination:
    Cesium.Cartesian3.fromDegrees(
        factoryLon,
        factoryLat,
        2500
    ),

    orientation:{
        heading:0,
        pitch:Cesium.Math.toRadians(-45),
        roll:0
    },

    duration:4

});

const factoryMarker = viewer.entities.add({

    name:"Liz Fashion Industry",

    position:
    Cesium.Cartesian3.fromDegrees(
        factoryLon,
        factoryLat
    ),

    billboard:{
        image:"https://cdn-icons-png.flaticon.com/512/684/684908.png",
        scale:0.08
    },

    label:{
        text:"Liz Fashion Industry",
        showBackground:true,
        pixelOffset:new Cesium.Cartesian2(0,20)
    },

    description:`
        <h2>Liz Fashion Industry</h2>
        <p>Shafipur, Gazipur, Bangladesh</p>
        <p>Lat: 24.0320434</p>
        <p>Lon: 90.2701416</p>
    `
});

viewer.selectedEntity = factoryMarker;

/* =========================
   APPROXIMATE FACTORY AREA
   ========================= */

viewer.entities.add({

    name:"Factory Boundary",

    polygon:{

        hierarchy:
        Cesium.Cartesian3.fromDegreesArray([

            90.26990,24.03225,
            90.27055,24.03225,
            90.27055,24.03180,
            90.26990,24.03180

        ]),

        material:
        Cesium.Color.DODGERBLUE.withAlpha(0.45),

        outline:true,

        outlineColor:
        Cesium.Color.WHITE,

        extrudedHeight:30

    }

});

/* =========================
   VIEW FACTORY BUTTON
   ========================= */

document.getElementById("viewFactory")
.addEventListener("click",function(){

    viewer.flyTo(factoryMarker,{

        offset:new Cesium.HeadingPitchRange(
            0,
            Cesium.Math.toRadians(-45),
            1500
        )

    });

});

/* =========================
   CLICK MARKER
   ========================= */

const handler =
new Cesium.ScreenSpaceEventHandler(
viewer.scene.canvas
);

handler.setInputAction(function(click){

    const picked =
    viewer.scene.pick(click.position);

    if(
        Cesium.defined(picked) &&
        picked.id === factoryMarker
    ){

        viewer.selectedEntity =
        factoryMarker;

        viewer.flyTo(factoryMarker,{

            offset:
            new Cesium.HeadingPitchRange(
                0,
                Cesium.Math.toRadians(-45),
                1200
            )

        });

    }

},
Cesium.ScreenSpaceEventType.LEFT_CLICK);

</script>

</body>
</html>
